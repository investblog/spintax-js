name: Release n8n node

# Publishes n8n-nodes-spintax to npm with PROVENANCE via OIDC Trusted Publishing —
# no tokens, no OTP. Provenance is not optional here: n8n requires it for community
# nodes published after May 2026. One-time setup on npmjs.com is required (see
# RELEASING.md): package n8n-nodes-spintax → Settings → Trusted Publisher →
# GitHub Actions → org/repo = investblog/spintax-js, workflow = release-n8n.yml.
# The @spintax/core entry does NOT cover this package.
#
# Release flow: bump packages/n8n-node/package.json → commit → tag n8n-node-vX.Y.Z
# → push tag. The prefix keeps it out of release.yml's `v*` glob.

on:
  push:
    tags: ['n8n-node-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required: OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing / provenance needs npm >= 11.5.1 — newer than the npm
      # bundled with the Node runtime, so upgrade it.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      # Safety: a pushed n8n-node-vX.Y.Z tag must match the version we're about to
      # publish, so a stale/mismatched tag fails loudly instead of republishing.
      - name: Verify tag matches n8n-nodes-spintax version
        if: startsWith(github.ref, 'refs/tags/n8n-node-v')
        run: |
          TAG="${GITHUB_REF_NAME#n8n-node-v}"
          PKG="$(node -p "require('./packages/n8n-node/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag n8n-node-v$TAG does not match n8n-nodes-spintax version $PKG"
            exit 1
          fi
          echo "Publishing n8n-nodes-spintax@$PKG"

      # A tag can point at ANY commit — main's CI passing is not a precondition for
      # publishing. So the release job re-runs the full CI gate set rather than
      # trusting an upstream green. Keep these steps in sync with ci.yml.
      - name: Validate golden corpus (schema)
        run: npm run conformance:validate

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package checks (publint + attw)
        run: npm run check:pkg

      - name: Tarball smoke (install + ESM/CJS import)
        run: npm run smoke:pack

      - name: n8n node tarball smoke (require + bundled engine)
        run: npm run smoke:pack:n8n

      # TEMPORARY bootstrap: a Trusted Publisher entry cannot be created for a
      # package that has never been published, so the FIRST publish authenticates
      # with the NPM_TOKEN secret (granular token). Provenance still attaches —
      # it needs GitHub Actions + OIDC attestation, not Trusted Publishing.
      # ONCE n8n-nodes-spintax exists and its Trusted Publisher entry points at
      # this workflow: delete this env block AND revoke/delete the token.
      - name: Publish n8n-nodes-spintax (provenance)
        run: npm publish -w n8n-nodes-spintax --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
