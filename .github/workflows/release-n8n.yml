name: Release n8n node

# Publishes n8n-nodes-spintax to npm with PROVENANCE via OIDC Trusted Publishing —
# no tokens, no OTP. Provenance is not optional here: n8n requires it for community
# nodes published after May 2026. One-time setup on npmjs.com is required (see
# RELEASING.md): package n8n-nodes-spintax → Settings → Trusted Publisher →
# GitHub Actions → org/repo = investblog/spintax-js, workflow = release-n8n.yml.
# The @spintax/core entry does NOT cover this package.
#
# Release flow: bump packages/n8n-node/package.json → commit → tag n8n-node-vX.Y.Z
# → push tag. The prefix keeps it out of release.yml's `v*` glob.

on:
  push:
    tags: ['n8n-node-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required: OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing / provenance needs npm >= 11.5.1 — newer than the npm
      # bundled with the Node runtime, so upgrade it.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      # Safety: publishes happen ONLY from an n8n-node-vX.Y.Z tag ref, and the tag
      # must match the version we're about to publish, so a stale/mismatched tag —
      # or a workflow_dispatch pointed at a branch — fails loudly instead of
      # publishing an untagged commit. (Dispatch from a tag ref is still allowed:
      # `gh workflow run --ref n8n-node-vX.Y.Z`.)
      - name: Verify ref is a release tag matching the package version
        run: |
          case "$GITHUB_REF" in
            refs/tags/n8n-node-v*) ;;
            *)
              echo "::error::Refusing to publish from '$GITHUB_REF' — run this workflow from an n8n-node-vX.Y.Z tag"
              exit 1
              ;;
          esac
          TAG="${GITHUB_REF_NAME#n8n-node-v}"
          PKG="$(node -p "require('./packages/n8n-node/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag n8n-node-v$TAG does not match n8n-nodes-spintax version $PKG"
            exit 1
          fi
          echo "Publishing n8n-nodes-spintax@$PKG"

      # A tag can point at ANY commit — main's CI passing is not a precondition for
      # publishing. So the release job re-runs the full CI gate set rather than
      # trusting an upstream green. Keep these steps in sync with ci.yml.
      - name: Validate golden corpus (schema)
        run: npm run conformance:validate

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package checks (publint + attw)
        run: npm run check:pkg

      - name: Tarball smoke (install + ESM/CJS import)
        run: npm run smoke:pack

      - name: n8n node tarball smoke (require + bundled engine)
        run: npm run smoke:pack:n8n

      - name: MCP server tarball smoke (bin over stdio + engine as a dependency)
        run: npm run smoke:pack:mcp

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # publish token automatically, and attaches a provenance attestation.
      # (The package's Trusted Publisher entry points at this workflow. The
      # NPM_TOKEN repo secret still exists for a future bootstrap of a NEW
      # package — a Trusted Publisher entry can't precede the first publish —
      # but this workflow no longer uses it.)
      - name: Publish n8n-nodes-spintax (provenance via OIDC)
        run: npm publish -w n8n-nodes-spintax --provenance --access public

  # The exact-version scan follows EVERY publish (RELEASING.md): it verifies the
  # npm provenance and lints the attested source, so it can only run against the
  # published release. Retries cover registry propagation lag.
  scan:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan the published release
        run: |
          VERSION="$(node -p "require('./packages/n8n-node/package.json').version")"
          for attempt in 1 2 3; do
            if npx -y @n8n/scan-community-package "n8n-nodes-spintax@$VERSION"; then
              exit 0
            fi
            echo "Scan attempt $attempt failed — retrying in 30s (registry propagation?)"
            sleep 30
          done
          echo "::error::Scanner did not pass for n8n-nodes-spintax@$VERSION"
          exit 1
